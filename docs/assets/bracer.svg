<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">bracer</title>
  <desc id="desc">A terminal-style wordmark wired to an illustrated fitness band. A very small supervisor for a very large language model. This is a schematic, not a device screenshot.</desc>
