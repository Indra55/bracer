  </g>
  <g font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">
    <text x="48" y="57" font-size="11" letter-spacing="2" fill="#83998b">MI BAND 5 / CODEX / A QUESTIONABLE USE OF BLUETOOTH</text>
    <text x="43" y="140" font-size="94" letter-spacing="-6" fill="#dfe7db">bracer<tspan fill="#c7f67b">_</tspan></text>
    <text x="49" y="220" font-size="16" fill="#dfe7db">a very small supervisor</text>
    <text x="49" y="246" font-size="16" fill="#83998b">for a very large language model.</text>
    <text x="49" y="287" font-size="11" fill="#83998b">permission_request ──► bluetooth ──► wrist</text>
  </g>
